manifest_version = 1

[package]
id = "org.dreamweave.add-vanilla-refs"
version = "0.1.0"
jess_api = "1"
default_target = "add-vanilla-refs"
include = ["src"]
tests = [
  "tests/run.jsl",
  "tests/log.jsl",
  "tests/commands.jsl",
  "tests/cli.jsl",
  "tests/style.jsl",
]

[dependencies]
"org.dreamweave.tes3" = "0.1"
"org.dreamweave.tes3conv" = "0.1"

[modules]
"@add-vanilla-refs" = "src/init.jsl"
"@add-vanilla-refs/commands" = "src/commands.jsl"
"@add-vanilla-refs/cli" = "src/cli.jsl"

# Every module here is inert API: it does nothing until something requires it, and runs with the
# authority of whatever calls it. `@add-vanilla-refs` never touches the filesystem: callers hand
# it record lists and get a record list and a log back. `@add-vanilla-refs/commands` reads the
# plugin and its masters and writes the plugin, so its caller needs to read and write files.

[[layer]]
id = "add-vanilla-refs.core"
requires = ["tes3.core", "tes3conv.core"]
exports = ["@add-vanilla-refs", "@add-vanilla-refs/commands", "@add-vanilla-refs/cli"]

# The command line: `src/main.jsl` hands its arguments to `@add-vanilla-refs/cli`. A run asks
# which folder it is in and reads Starwind.esp and the three masters from it (filesystem.read),
# and writes Starwind.esp over the one it read (filesystem.write). It reads no environment, runs
# no other program, and opens no connection.

[targets.add-vanilla-refs]
kind = "command"
command = "add-vanilla-refs"
entry = "src/main.jsl"
capabilities = ["filesystem.read", "filesystem.write"]
